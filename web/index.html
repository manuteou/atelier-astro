<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier astro</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%237c5cff%22/%3E%3C/svg%3E">
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot"></span>Atelier astro</div>
  <select id="projectSel" title="Projet"></select>
  <button id="btnNew" class="ghost">+ Nouveau projet</button>
  <div class="spacer"></div>
  <span id="presetBadge" class="badge hidden"></span>
  <button id="btnPresets" class="ghost">Presets</button>
  <button id="btnNotes" class="ghost">NOTES</button>
  <button id="btnFolder" class="ghost">Dossier</button>
  <button id="btnMateriel" class="ghost">Matériel</button>
  <button id="btnSettings" class="ghost">Réglages</button>
  <span id="sirilPill" class="pill">Siril ?</span>
</header>

<div class="layout">
  <nav id="steps" class="steps"></nav>
  <main id="main" class="main">
    <div class="empty" id="welcome">
      <h1>Bienvenue</h1>
      <p>Crée un projet à partir de tes sessions (<code>&lt;racine&gt;\&lt;SESSION&gt;\lights</code>), puis avance étape par étape.
      La technique est guidée ; chaque choix de rendu se fait sur des variantes côte à côte.</p>
      <button id="btnNew2">Créer un projet</button>
    </div>
  </main>
</div>

<section id="console" class="console collapsed">
  <div class="console-bar">
    <span id="jobTitle">Aucun traitement</span>
    <span id="jobStatus" class="pill small"></span>
    <div id="jobProgress" class="jobprog hidden"><div id="jobBar"></div></div>
    <span id="jobDetail" class="muted small"></span>
    <button id="jobCancel" class="ghost small hidden" title="Arrête le traitement en cours (Siril compris)">Annuler</button>
    <div class="spacer"></div>
    <button id="btnConsole" class="ghost small">Journal</button>
  </div>
  <pre id="log"></pre>
</section>

<!-- Visionneuse -->
<div id="viewer" class="modal hidden">
  <div class="viewer-bar">
    <span id="viewerTitle"></span>
    <div class="seg" id="modeSeg">
      <button data-mode="view" class="on">Voir</button>
      <button data-mode="zoom">Zone de zoom</button>
      <button data-mode="crop">Cadrer</button>
      <button data-mode="point">Point</button>
    </div>
    <span id="viewerCoords" class="mono muted"></span>
    <div class="spacer"></div>
    <button id="viewerClose" class="ghost">Fermer ✕</button>
  </div>
  <div class="viewer-body" id="viewerBody">
    <div class="stage" id="stage">
      <img id="viewerImg" alt="">
      <div id="sel" class="sel hidden"></div>
    </div>
  </div>
  <div class="viewer-help muted" id="viewerHelp"></div>
</div>

<!-- Fenêtres -->
<div id="dlg" class="modal hidden">
  <div class="dialog">
    <div class="dialog-head"><h2 id="dlgTitle"></h2><button class="ghost" id="dlgClose">✕</button></div>
    <div id="dlgBody" class="dialog-body"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
